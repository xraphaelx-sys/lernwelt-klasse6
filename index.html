<style>

</style><main><header class="hero"><h1>🎓 Lernwelt – Klasse 6</h1><div>Dein Lernplatz für Klassenarbeiten und Tests</div><p class="stats">⭐ Punkte: <b id="p">0</b>　✅ Richtig: <b id="r">0</b>　📚 Falsch: <b id="w">0</b></p></header>
<section class="card"><h2>1. Fach auswählen</h2><div class="grid" id="subjects"></div></section>
<section class="card"><h2>2. Thema auswählen</h2><p class="muted" id="hint">Wähle zuerst ein Fach.</p><div class="grid" id="topics"></div></section>
<section class="card"><h2>3. Aufgaben üben</h2><p id="selected" class="muted">Noch kein Thema ausgewählt</p><p id="progress"></p><h3 id="q">Wähle ein Fach und ein Thema!</h3><div class="answers" id="answers"></div><div id="feedback"></div><button class="primary hide" id="next">Nächste Aufgabe ➜</button><button class="hide" id="again">Thema neu starten</button></section></main>
<script>
const bank={
Mathe:{"Brüche":[["Was ist 1/2 von 18?",["6","9","12"],1,"Die Hälfte bedeutet durch 2 teilen: 18 : 2 = 9."],["1/4 + 2/4 = ?",["2/4","3/4","3/8"],1,"Bei gleichem Nenner addierst du die Zähler: 1 + 2 = 3. Der Nenner bleibt 4."]],
"Dezimalzahlen":[["2,5 + 1,3 = ?",["3,8","3,7","4,8"],0,"Komma unter Komma schreiben: 2,5 + 1,3 = 3,8."],["4,2 × 10 = ?",["4,2","42","420"],1,"Beim Multiplizieren mit 10 rückt das Komma eine Stelle nach rechts."]],
"Multiplikation & Division":[["24 × 6 = ?",["124","144","164"],1,"20 × 6 = 120 und 4 × 6 = 24. Zusammen 144."],["168 : 7 = ?",["21","24","28"],1,"7 × 24 = 168. Deshalb ist 168 : 7 = 24."]],
"Geometrie":[["Wie viele rechte Winkel hat ein Rechteck?",["2","4","6"],1,"Alle vier Ecken eines Rechtecks sind rechte Winkel."],["Umfang eines Quadrats?",["Seite × 4","Seite × Seite","Seite + 2"],0,"Ein Quadrat hat vier gleich lange Seiten. Umfang = 4 × Seitenlänge."]]},
Deutsch:{"Grammatik":[["Welches Wort ist ein Verb?",["laufen","blau","Tisch"],0,"„Laufen“ ist ein Verb. Verben beschreiben Tätigkeiten."],["Welches Wort ist ein Nomen?",["schnell","Katze","springen"],1,"„Katze“ ist ein Nomen und wird großgeschrieben."]],
"Rechtschreibung":[["Welche Schreibweise ist richtig?",["Fahrrad","Farad","Farrad"],0,"Richtig ist „Fahrrad“ mit h und doppeltem r."],["Wie schreibt man das Nomen?",["das lesen","das Lesen","das LEsen"],1,"Wenn ein Verb als Nomen verwendet wird, schreibt man es groß: das Lesen."]],
"Satzbau":[["Prädikat in „Mia liest ein Buch“?",["Mia","liest","ein Buch"],1,"Das Prädikat sagt, was jemand tut: Mia liest."],["Satzzeichen am Ende einer Frage?",[".","?","!"],1,"Eine direkte Frage endet mit einem Fragezeichen."]]},
Englisch:{"Vokabeln":[["Was bedeutet apple?",["Birne","Apfel","Kirsche"],1,"Apple bedeutet Apfel."],["Was bedeutet school?",["Schule","Haus","Freund"],0,"School bedeutet Schule."]],
"Grammatik":[["She ___ a dog.",["have","has","are"],1,"Bei he, she und it verwendest du „has“."],["Mehrzahl von child?",["childs","children","childes"],1,"Die unregelmäßige Mehrzahl von child lautet children."]],
"Simple Present":[["He ___ football.",["play","plays","playing"],1,"Bei he, she und it bekommt das Verb meistens ein -s."],["I ___ like tea.",["doesn't","don't","isn't"],1,"Bei I verwendest du „don't“: I don't like tea."]]},
Biologie:{"Tiere":[["Welches Tier ist ein Säugetier?",["Frosch","Delfin","Forelle"],1,"Der Delfin ist ein Säugetier. Er atmet Luft und säugt seine Jungen."],["Womit atmen Fische?",["Lungen","Kiemen","Haut"],1,"Fische nehmen Sauerstoff aus dem Wasser mit ihren Kiemen auf."]],
"Pflanzen":[["Was brauchen Pflanzen zur Fotosynthese?",["Licht, Wasser und CO₂","Nur Erde","Nur Sauerstoff"],0,"Pflanzen brauchen Licht, Wasser und Kohlenstoffdioxid für die Fotosynthese."],["Welcher Teil nimmt Wasser auf?",["Blüte","Wurzel","Frucht"],1,"Die Wurzeln nehmen Wasser und Mineralstoffe aus dem Boden auf."]]},
Geschichte:{"Altes Ägypten":[["An welchem Fluss lag das alte Ägypten?",["Nil","Rhein","Donau"],0,"Das alte Ägypten entstand am Nil."],["Wie hieß die Schrift der Ägypter?",["Runen","Hieroglyphen","Latein"],1,"Die Bildzeichen der alten Ägypter nennt man Hieroglyphen."]],
"Mittelalter":[["Wozu dienten Burgen?",["Schutz und Wohnsitz","Flughafen","Fabrik"],0,"Burgen waren Wohnsitze und konnten zur Verteidigung dienen."],["Wie nennt man einen Kämpfer zu Pferd?",["Ritter","Pharao","Händler"],0,"Ritter waren bewaffnete Kämpfer, häufig zu Pferd."]]},

Geografie: {
  "Europa – Länder und Hauptstädte": [
    ["Was ist die Hauptstadt von Spanien?", ["Rom", "Madrid", "Paris"], 1, "Madrid ist die Hauptstadt von Spanien."],
    ["Was ist die Hauptstadt von Österreich?", ["Wien", "Bern", "Berlin"], 0, "Wien ist die Hauptstadt von Österreich."]
  ],
  "Europas Gebirge und Flüsse": [
    ["Wie heißt das große Gebirge in Mitteleuropa?", ["Alpen", "Harz", "Schwarzwald"], 0, "Die Alpen liegen in Mitteleuropa."],
    ["Welcher Fluss fließt durch Budapest?", ["Rhein", "Donau", "Seine"], 1, "Die Donau fließt durch Budapest."]
  ],
  "Die Europäische Union": [
    ["Wie wird die Europäische Union abgekürzt?", ["EU", "UNO", "NATO"], 0, "EU steht für Europäische Union."],
    ["Welche Währung nutzen viele EU-Länder?", ["Dollar", "Euro", "Yen"], 1, "Viele EU-Länder nutzen den Euro."]
  ],
  "Kontinente und Länder": [
    ["Auf welchem Kontinent liegt Deutschland?", ["Asien", "Europa", "Afrika"], 1, "Deutschland liegt in Mitteleuropa."]
  ],
  "Karten und Orientierung": [
    ["Gegenüber von Norden liegt...", ["Osten", "Süden", "Westen"], 1, "Süden liegt gegenüber von Norden."],
    ["Was zeigt der Kartenmaßstab?", ["Verkleinerungsverhältnis", "Wetter", "Bevölkerungsalter"], 0, "Der Maßstab zeigt, wie Entfernungen verkleinert dargestellt werden."]
  ]
}
  };
let subject = "";
let topic = "";
let questions = [];
let index = 0;
let score = 0;
let right = 0;
let wrong = 0;

const el = id => document.getElementById(id);

function updateStats() {
  el("p").textContent = score;
  el("r").textContent = right;
  el("w").textContent = wrong;
}

function showSubjects() {
  el("subjects").innerHTML = "";
  Object.keys(bank).forEach(name => {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => {
      subject = name;
      el("subjects").querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      showTopics();
    };
    el("subjects").appendChild(b);
  });
}

function showTopics() {
  el("topics").innerHTML = "";
  el("hint").textContent = "Wähle ein Thema für " + subject + ".";
  Object.keys(bank[subject]).forEach(name => {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => {
      topic = name;
      el("topics").querySelectorAll("button").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      start();
    };
    el("topics").appendChild(b);
  });
}

function start() {
  questions = bank[subject][topic];
  index = 0;
  el("selected").textContent = subject + " – " + topic;
  el("again").classList.add("hide");
  showQuestion();
}

function showQuestion() {
  el("feedback").innerHTML = "";
  el("next").classList.add("hide");
  const q = questions[index];
  el("progress").textContent = "Aufgabe " + (index + 1) + " von " + questions.length;
  el("q").textContent = q[0];
  el("answers").innerHTML = "";

  q[1].forEach((answer, i) => {
    const b = document.createElement("button");
    b.textContent = String.fromCharCode(65 + i) + ") " + answer;
    b.onclick = () => checkAnswer(i);
    el("answers").appendChild(b);
  });
}

function checkAnswer(choice) {
  const q = questions[index];
  const buttons = el("answers").querySelectorAll("button");
  buttons.forEach(b => b.disabled = true);

  if (choice === q[2]) {
    score += 10;
    right++;
    el("feedback").innerHTML =
      '<div class="good"><b>✅ Richtig! +10 Punkte</b><p>' + q[3] + '</p></div>';
  } else {
    wrong++;
    el("feedback").innerHTML =
      '<div class="bad"><b>❌ Leider falsch!</b><p>Richtig ist: ' +
      q[1][q[2]] + '</p><p>' + q[3] + '</p></div>';
  }

  updateStats();
  el("next").classList.remove("hide");
  el("next").textContent =
    index === questions.length - 1 ? "Ergebnis anzeigen" : "Nächste Aufgabe ➜";
}

el("next").onclick = () => {
  index++;
  if (index < questions.length) {
    showQuestion();
  } else {
    el("q").textContent = "🎉 Fertig! Du hast " + right + " Aufgaben richtig.";
    el("progress").textContent = "Deine Punkte: " + score;
    el("answers").innerHTML = "";
    el("feedback").innerHTML = "";
    el("next").classList.add("hide");
    el("again").classList.remove("hide");
  }
};

el("again").onclick = start;

showSubjects();
updateStats();
