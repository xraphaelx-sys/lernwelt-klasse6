<style>
*{box-sizing:border-box}
body{font:16px system-ui;margin:0;background:#f1f5fb;color:#17233b}
main{max-width:950px;margin:auto;padding:18px}
.hero{background:linear-gradient(120deg,#245a9b,#6043a5);color:white;padding:25px;border-radius:18px}
.card{background:white;border:1px solid #dce3ef;border-radius:15px;padding:17px;margin:15px 0}
button,select{padding:12px;border:1px solid #ccd5e5;border-radius:10px;background:white;cursor:pointer;color:#17233b;font-size:15px}
button:hover,.sel{border:2px solid #5368d9;background:#eef0ff}
button:disabled{opacity:.6;cursor:default}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px}
.answers{display:grid;gap:9px}
.primary{background:#5368d9;color:white;width:100%;margin-top:12px}
.good,.bad{padding:13px;border-radius:10px;margin-top:12px}
.good{background:#e7f8ed}
.bad{background:#fff0ef}
.hide{display:none}
.muted{color:#63718a}
.stats{display:flex;gap:18px;flex-wrap:wrap}
</style>

📚 Falsch: <b id="w">0</b>

<div class="answers" id="answers"></div>
<div id="feedback"></div>
<button class="primary hide" id="next">Nächste Aufgabe ➜</button>
<button class="hide" id="again">Thema neu starten</button>
</section>

let subject="",topic="",questions=[],index=0;
let score=0,right=0,wrong=0;

const el=id=>document.getElementById(id);

function stats(){
el("p").textContent=score;
el("r").textContent=right;
el("w").textContent=wrong;
}

function showSubjects(){
el("subjects").innerHTML="";
Object.keys(bank).forEach(name=>{
const b=document.createElement("button");
b.textContent=name;
b.onclick=()=>{
subject=name;
el("subjects").querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
b.classList.add("sel");
showTopics();
};
el("subjects").appendChild(b);
});
}

function showTopics(){
el("topics").innerHTML="";
el("hint").textContent="Wähle ein Thema für "+subject+".";
Object.keys(bank[subject]).forEach(name=>{
const b=document.createElement("button");
b.textContent=name;
b.onclick=()=>{
topic=name;
el("topics").querySelectorAll("button").forEach(x=>x.classList.remove("sel"));
b.classList.add("sel");
start();
};
el("topics").appendChild(b);
});
}

function start(){
questions=bank[subject][topic].slice();
index=0;
el("selected").textContent=subject+" – "+topic;
el("again").classList.add("hide");
showQuestion();
}

function showQuestion(){
el("feedback").innerHTML="";
el("next").classList.add("hide");
const q=questions[index];
el("progress").textContent="Aufgabe "+(index+1)+" von "+questions.length;
el("q").textContent=q[0];
el("answers").innerHTML="";
q[1].forEach((answer,i)=>{
const b=document.createElement("button");
b.textContent=String.fromCharCode(65+i)+") "+answer;
b.onclick=()=>checkAnswer(i);
el("answers").appendChild(b);
});
}

function checkAnswer(choice){
const q=questions[index];
const buttons=el("answers").querySelectorAll("button");
buttons.forEach(b=>b.disabled=true);

if(choice===q[2]){
score+=10;
right++;
el("feedback").innerHTML='<div class="good"><b>✅ Richtig! +10 Punkte</b></div>';
}else{
wrong++;
el("feedback").innerHTML='<div class="bad"><b>❌ Leider falsch!</b></div>';
}
const explanation=document.createElement("p");
explanation.textContent="Erklärung: "+q[3];
el("feedback").appendChild(explanation);
if(choice!==q[2]){
const correct=document.createElement("p");
correct.textContent="Richtige Antwort: "+q[1][q[2]];
el("feedback").appendChild(correct);
}
stats();
el("next").classList.remove("hide");
el("next").textContent=index===questions.length-1?"Ergebnis anzeigen":"Nächste Aufgabe ➜";
}

el("next").onclick=()=>{
index++;
if(index<questions.length){
showQuestion();
}else{
el("q").textContent="🎉 Geschafft! Du hast "+right+" Aufgaben insgesamt richtig beantwortet.";
el("progress").textContent="Deine Punkte: "+score+" | Falsch beantwortet: "+wrong;
el("answers").innerHTML="";
el("feedback").innerHTML="";
el("next").classList.add("hide");
el("again").classList.remove("hide");
}
};

el("again").onclick=start;

showSubjects();
stats();
</script>
