const subjectSelect = document.getElementById("subject");
const topicSelect = document.getElementById("topic");

let questions = [];
let current = 0;
let points = 0;
let right = 0;
let wrong = 0;
let answered = false;

function shuffle(array) {
  const copy = [...array];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function fillSubjects() {
  subjectSelect.innerHTML = "";
  Object.keys(bank).forEach(subject => {
    const option = document.createElement("option");
    option.value = subject;
    option.textContent = subject;
    subjectSelect.appendChild(option);
  });
  fillTopics();
}

function fillTopics() {
  const subject = subjectSelect.value;
  topicSelect.innerHTML = "";
  Object.keys(bank[subject]).forEach(topic => {
    const option = document.createElement("option");
    option.value = topic;
    option.textContent = topic;
    topicSelect.appendChild(option);
  });
}

subjectSelect.addEventListener("change", fillTopics);

function startQuiz() {
  const subject = subjectSelect.value;
  const topic = topicSelect.value;

  questions = shuffle(bank[subject][topic]).slice(0, 30);
  current = 0;
  points = 0;
  right = 0;
  wrong = 0;

  document.getElementById("start").style.display = "none";
  document.getElementById("quiz").style.display = "block";

  updateStats();
  showQuestion();
}

function updateStats() {
  document.getElementById("points").textContent = points;
  document.getElementById("right").textContent = right;
  document.getElementById("wrong").textContent = wrong;
}

function showQuestion() {
  answered = false;

  if (current >= questions.length) {
    showEnd();
    return;
  }

  const q = questions[current];
  document.getElementById("counter").textContent =
    "Frage " + (current + 1) + " von " + questions.length;

  document.getElementById("question").textContent = q[0];
  document.getElementById("feedback").style.display = "none";
  document.getElementById("next").disabled = true;
  document.getElementById("next").textContent = "Weiter";

  document.getElementById("bar").style.width =
    (current / questions.length * 100) + "%";

  const answers = makeAnswers(q);
  const container = document.getElementById("answers");
  container.innerHTML = "";

  answers.forEach(answer => {
    const button = document.createElement("button");
    button.className = "answer";
    button.textContent = answer;
    button.addEventListener("click", () => checkAnswer(answer, button));
    container.appendChild(button);
  });
}

function makeAnswers(question) {
  const correctAnswer = question[1];

  const allAnswers = questions
    .map(q => q[1])
    .filter(answer => answer !== correctAnswer);

  const uniqueWrong = [...new Set(allAnswers)];
  const choices = shuffle(uniqueWrong).slice(0, 3);
  choices.push(correctAnswer);

  return shuffle(choices);
}

function checkAnswer(answer, clickedButton) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const feedback = document.getElementById("feedback");
  const buttons = document.querySelectorAll(".answer");

  buttons.forEach(button => {
    button.disabled = true;
    if (button.textContent === q[1]) {
      button.classList.add("correct");
    }
  });

  if (answer === q[1]) {
    right++;
    points += 10;
    feedback.style.background = "#dcfce7";
    feedback.innerHTML = "✅ <strong>Richtig!</strong> Sehr gut! Du bekommst 10 Punkte.";
  } else {
    wrong++;
    clickedButton.classList.add("wrong");
    feedback.style.background = "#fee2e2";
    feedback.innerHTML =
      "❌ <strong>Leider falsch!</strong><br>" +
      "Richtige Antwort: <strong>" + q[1] + "</strong><br>" +
      "Erklärung: " + q[2];
  }

  feedback.style.display = "block";
  document.getElementById("next").disabled = false;
  document.getElementById("next").textContent =
    current === questions.length - 1 ? "Ergebnis ansehen" : "Nächste Frage";

  updateStats();
}

function nextQuestion() {
  if (!answered) return;
  current++;
  showQuestion();
}

function showEnd() {
  document.getElementById("question").textContent = "🎉 Thema geschafft!";
  document.getElementById("answers").innerHTML = "";

  document.getElementById("counter").textContent = "Alle Fragen beantwortet!";
  document.getElementById("bar").style.width = "100%";

  const feedback = document.getElementById("feedback");
  feedback.style.display = "block";
  feedback.style.background = "#e0eaff";

  const percentage = Math.round((right / questions.length) * 100);

  feedback.innerHTML =
    "<h3>Dein Ergebnis</h3>" +
    "<p>⭐ Punkte: <strong>" + points + "</strong></p>" +
    "<p>✅ Richtige Antworten: <strong>" + right + "</strong></p>" +
    "<p>❌ Falsche Antworten: <strong>" + wrong + "</strong></p>" +
    "<p>📊 Richtig beantwortet: <strong>" + percentage + "%</strong></p>" +
    "<p>" + getMessage(percentage) + "</p>";

  document.getElementById("next").textContent = "Noch einmal spielen";
  document.getElementById("next").disabled = false;
  document.getElementById("next").onclick = restartQuiz;
}

function getMessage(percentage) {
  if (percentage === 100) return "Perfekt! Du hast alle Fragen richtig beantwortet! 🏆";
  if (percentage >= 80) return "Super gemacht! Du kennst dich richtig gut aus! 🌟";
  if (percentage >= 60) return "Gut gemacht! Mit etwas Übung wirst du noch besser!";
  if (percentage >= 40) return "Du bist auf einem guten Weg. Übe das Thema noch einmal!";
  return "Nicht aufgeben! Lies die Erklärungen und probiere es noch einmal.";
}

function restartQuiz() {
  document.getElementById("next").onclick = nextQuestion;
  startQuiz();
}

function backToMenu() {
  document.getElementById("quiz").style.display = "none";
  document.getElementById("start").style.display = "block";
  document.getElementById("next").onclick = nextQuestion;
}

fillSubjects();
</script>

</html>
